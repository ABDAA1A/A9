<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تحدي الموزة 3D - النسخة الكاملة</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 100; pointer-events: none; }
        
        #game-over { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); display: none; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 1000; 
        }
        #game-over h1 { color: #ffeb3b; font-size: 50px; margin-bottom: 20px; }
        #retry-btn { padding: 15px 50px; font-size: 24px; background: #4caf50; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        /* أزرار التحكم */
        #joy { position: absolute; bottom: 40px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 3px solid white; border-radius: 50%; z-index: 200; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; }
        #shoot { position: absolute; bottom: 40px; right: 30px; width: 100px; height: 100px; background: rgba(255,0,0,0.6); border: 3px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; z-index: 200; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>لقد خسرت!</h1>
        <button id="retry-btn">إعادة المحاولة</button>
    </div>

    <div id="joy"><div id="stick"></div></div>
    <div id="shoot">إطلاق</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let score = 0, gameActive = true;
        const enemies = [], bullets = [], particles = [];
        let moveX = 0, moveZ = 0;

        // 1. إعداد المشهد
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        // 2. الأرضية العشبية
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500), 
            new THREE.MeshStandardMaterial({ color: 0x2d5a27 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 3. دالة صنع الشخصيات (موزة وبشر)
        function createCharacter(type) {
            const group = new THREE.Group();
            const color = (type === 'player') ? 0xffeb3b : 0x444444;
            const skin = (type === 'player') ? 0xffeb3b : 0xffdbac;

            // الجسم
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 1.2;
            group.add(body);

            // الرأس
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({ color: skin }));
            head.position.y = 1.9;
            group.add(head);

            // الأطراف
            const limbGeo = new THREE.CapsuleGeometry(0.1, 0.6);
            const limbMat = new THREE.MeshStandardMaterial({ color: (type === 'player' ? 0xffeb3b : 0x222222) });
            
            const lArm = new THREE.Mesh(limbGeo, limbMat); lArm.position.set(-0.5, 1.3, 0);
            const rArm = lArm.clone(); rArm.position.x = 0.5;
            const lLeg = new THREE.Mesh(limbGeo, new THREE.MeshStandardMaterial({color: 0x111111})); lLeg.position.set(-0.25, 0.4, 0);
            const rLeg = lLeg.clone(); rLeg.position.x = 0.25;
            group.add(lArm, rArm, lLeg, rLeg);

            // مسدس للاعب
            if (type === 'player') {
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                gun.position.set(0.6, 1.4, 0.4);
                group.add(gun);
            }

            return group;
        }

        const player = createCharacter('player');
        scene.add(player);

        // 4. التحكم (الجويستيك)
        const joy = document.getElementById('joy');
        const stick = document.getElementById('stick');

        const handleMove = (x, y) => {
            const rect = joy.getBoundingClientRect();
            const dx = x - (rect.left + 60);
            const dy = y - (rect.top + 60);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            moveX = Math.cos(angle) * (dist / 50);
            moveZ = Math.sin(angle) * (dist / 50);
            stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        };

        window.addEventListener('touchmove', (e) => { handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => { moveX = 0; moveZ = 0; stick.style.transform = 'none'; });

        // 5. الإطلاق والانفجارات
        const shootBtn = document.getElementById('shoot');
        function fire() {
            if (!gameActive) return;
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            b.position.copy(player.position); b.position.y = 1.4;
            const dir = new THREE.Vector3(0, 0, -1.5); // الإطلاق للأمام دائماً
            b.velocity = dir;
            bullets.push(b); scene.add(b);
        }
        shootBtn.addEventListener('touchstart', (e) => { fire(); e.preventDefault(); });
        shootBtn.onclick = fire;

        function explode(pos) {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
                p.position.copy(pos);
                p.velocity = new THREE.Vector3((Math.random()-0.5)*0.4, Math.random()*0.4, (Math.random()-0.5)*0.4);
                p.life = 20;
                particles.push(p); scene.add(p);
            }
        }

        // 6. الأعداء
        function spawn() {
            if (!gameActive) return;
            const en = createCharacter('enemy');
            en.position.set((Math.random()-0.5)*40, 0, player.position.z - 40);
            enemies.push(en); scene.add(en);
        }
        setInterval(spawn, 1800);

        document.getElementById('retry-btn').onclick = () => location.reload();

        // 7. المحرك الرئيسي
        function animate() {
            requestAnimationFrame(animate);
            if (!gameActive) return;

            // حركة اللاعب والكاميرا
            player.position.x += moveX * 0.3;
            player.position.z += moveZ * 0.3;
            camera.position.set(player.position.x, 6, player.position.z + 12);
            camera.lookAt(player.position.x, 1, player.position.z);

            // الرصاص
            bullets.forEach((b, i) => {
                b.position.add(b.velocity);
                if (b.position.z < player.position.z - 60) { scene.remove(b); bullets.splice(i, 1); }
            });

            // الأعداء
            enemies.forEach((en, ei) => {
                en.position.z += 0.08; // سرعة سهلة
                en.lookAt(player.position.x, 0, player.position.z);
                
                // اصطدام الرصاص بالعدو
                bullets.forEach((b, bi) => {
                    if (b.position.distanceTo(en.position.clone().add(new THREE.Vector3(0,1,0))) < 1.3) {
                        explode(en.position);
                        scene.remove(en); enemies.splice(ei, 1);
                        scene.remove(b); bullets.splice(bi, 1);
                        score += 10; document.getElementById('score').innerText = score;
                    }
                });

                // خسارة
                if (en.position.distanceTo(player.position) < 1.5) {
                    gameActive = false;
                    document.getElementById('game-over').style.display = 'flex';
                }
            });

            // الجزيئات
            particles.forEach((p, i) => {
                p.position.add(p.velocity); p.life--;
                if (p.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            });

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
